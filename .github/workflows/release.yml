name: Release

# Every push to main (a merge, usually) checks versionName in app/build.gradle.kts. If that version
# has no release yet, this tests and builds a signed APK, tags the commit v<version> and publishes
# the release, which is what users' update checks see. Same version: nothing ships.
#
# To release: bump versionCode and versionName, then merge to main.
#
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   SIGNING_KEYSTORE_BASE64  the release keystore, base64 encoded
#   SIGNING_STORE_PASSWORD   its store password
#   SIGNING_KEY_ALIAS        the key alias
#   SIGNING_KEY_PASSWORD     the key password
# Always the same key: Android only installs an update signed like the app already installed.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Is this a new version?
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
             || git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null 2>&1; then
            echo "v$version is already released; nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v$version."
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 17
        if: steps.version.outputs.new == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: steps.version.outputs.new == 'true'
        uses: android-actions/setup-android@v3
        with:
          # The default list asks for the old 'tools' package, which no longer exists.
          packages: 'platform-tools'

      - name: Install Android SDK components
        if: steps.version.outputs.new == 'true'
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        if: steps.version.outputs.new == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Restore the signing key
        if: steps.version.outputs.new == 'true'
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "Signing secrets are missing"; exit 1; fi
          mkdir -p .signing
          echo "$KEYSTORE" | base64 --decode > .signing/release.jks
          {
            echo "storeFile=.signing/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > signing.properties

      - name: Test and build the release APK
        if: steps.version.outputs.new == 'true'
        run: ./gradlew --no-daemon test assembleRelease

      - name: Name the APK
        if: steps.version.outputs.new == 'true'
        run: cp app/build/outputs/apk/release/app-release.apk "SunPods-v${{ steps.version.outputs.version }}.apk"

      - name: Release notes from the changelog
        if: steps.version.outputs.new == 'true'
        run: |
          awk -v v="## ${{ steps.version.outputs.version }}" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md

      - name: Publish the release
        if: steps.version.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: SunPods ${{ steps.version.outputs.version }}
          body_path: notes.md
          make_latest: true
          files: SunPods-v${{ steps.version.outputs.version }}.apk

      - name: Remove the signing key
        if: always()
        run: rm -f .signing/release.jks signing.properties
