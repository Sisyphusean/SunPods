name: Release

# Push a tag like v2.28.0 to build a signed APK and open a draft GitHub release with it.
# Review the draft's notes on GitHub, then publish it. Publishing is what users' update checks see.
#
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   SIGNING_KEYSTORE_BASE64  the release keystore, base64 encoded
#   SIGNING_STORE_PASSWORD   its store password
#   SIGNING_KEY_ALIAS        the key alias
#   SIGNING_KEY_PASSWORD     the key password
# Always the same key: Android only installs an update signed like the app already installed.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default list asks for the old 'tools' package, which no longer exists.
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore the signing key
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "Signing secrets are missing"; exit 1; fi
          mkdir -p .signing
          echo "$KEYSTORE" | base64 --decode > .signing/release.jks
          {
            echo "storeFile=.signing/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > signing.properties

      - name: Check the tag matches the app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "$tag" != "$version" ]; then echo "Tag $tag doesn't match versionName $version"; exit 1; fi

      - name: Test and build the release APK
        run: ./gradlew --no-daemon test assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "SunPods-${GITHUB_REF_NAME}.apk"

      - name: Create a draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: SunPods ${{ github.ref_name }}
          generate_release_notes: true
          files: SunPods-${{ github.ref_name }}.apk

      - name: Remove the signing key
        if: always()
        run: rm -f .signing/release.jks signing.properties
