<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title description">
  <title id="title">SonyPods Battery compact Android widget</title>
  <desc id="description">A wide rectangular widget with battery status on top, sound modes in the middle, and ambient-only controls below the sound modes.</desc>

  <defs>
    <linearGradient id="widgetSurface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#242426"/>
      <stop offset="1" stop-color="#18181a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Background is presentation-only; it is not part of the widget. -->
  <rect width="1200" height="560" fill="#f4f4f4"/>

  <!-- Compact 2-row Android widget surface. -->
  <rect x="50" y="70" width="1100" height="420" rx="42" fill="url(#widgetSurface)" filter="url(#shadow)"/>

  <!-- Logo: the only area intended to open the app. -->
  <g id="app-launch-logo" aria-label="Open app">
    <circle cx="125" cy="168" r="58" fill="#18181a" stroke="#b8ff38" stroke-width="5"/>
    <g fill="#f4f4f4">
      <rect x="101" y="132" width="14" height="58" rx="7"/>
      <rect x="135" y="132" width="14" height="58" rx="7"/>
      <circle cx="108" cy="130" r="14"/>
      <circle cx="142" cy="130" r="14"/>
    </g>
    <text x="125" y="215" text-anchor="middle" fill="#f4f4f4" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">PODS</text>
  </g>

  <!-- Battery status row. -->
  <g fill="#f4f4f4" font-family="Arial, sans-serif" text-anchor="middle">
    <text x="340" y="145" font-size="20" fill="#c8c8c8">LEFT</text>
    <text x="340" y="193" font-size="46" font-weight="700">48%</text>

    <line x1="505" y1="126" x2="505" y2="205" stroke="#59595b" stroke-width="3"/>

    <text x="625" y="145" font-size="20" fill="#c8c8c8">RIGHT</text>
    <text x="625" y="193" font-size="46" font-weight="700">0%</text>

    <line x1="745" y1="126" x2="745" y2="205" stroke="#59595b" stroke-width="3"/>

    <text x="865" y="145" font-size="20" fill="#c8c8c8">CASE</text>
    <text x="865" y="193" font-size="46" font-weight="700">88%</text>
  </g>

  <!-- Refresh control. -->
  <g id="refresh-control" aria-label="Refresh battery" fill="none" stroke="#b8ff38" stroke-width="9" stroke-linecap="round">
    <path d="M1035 151a38 38 0 1 0 8 42"/>
    <path d="M1040 139v35h-35"/>
  </g>

  <!-- Sound switching modes. -->
  <g font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle">
    <rect x="90" y="255" width="225" height="72" rx="20" fill="#3b3b3e"/>
    <text x="202" y="300" fill="#f4f4f4">NC</text>

    <rect x="335" y="255" width="270" height="72" rx="20" fill="#3b3b3e"/>
    <text x="470" y="300" fill="#f4f4f4">AMBIENT</text>

    <rect x="625" y="255" width="225" height="72" rx="20" fill="#b8ff38"/>
    <text x="737" y="300" fill="#101010">OFF</text>
  </g>

  <!-- Ambient-only controls, deliberately below the sound-mode row. -->
  <g font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <rect x="90" y="365" width="112" height="66" rx="18" fill="#3b3b3e"/>
    <text x="146" y="408" fill="#f4f4f4" font-size="34">−</text>

    <rect x="220" y="365" width="440" height="66" rx="18" fill="#3b3b3e"/>
    <text x="440" y="406" fill="#f4f4f4">AMBIENT 20</text>

    <rect x="678" y="365" width="112" height="66" rx="18" fill="#3b3b3e"/>
    <text x="734" y="408" fill="#f4f4f4" font-size="34">+</text>

    <rect x="808" y="365" width="230" height="66" rx="18" fill="#3b3b3e"/>
    <text x="923" y="406" fill="#f4f4f4">VOICE</text>
  </g>
</svg>
